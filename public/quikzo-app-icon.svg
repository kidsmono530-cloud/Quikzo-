<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Quikzo Squircle App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#FFCD00" />

  <g fill="#0B0B0B">
    <!-- Top Speed Line -->
    <rect x="72" y="194" width="115" height="28" rx="14" />
    
    <!-- Middle Speed Line (Longest) -->
    <rect x="40" y="236" width="155" height="28" rx="14" />
    
    <!-- Bottom Speed Line -->
    <rect x="72" y="278" width="105" height="28" rx="14" />

    <!-- Circular 'Q' Ring -->
    <path fill-rule="evenodd" d="
      M 275,104
      A 146,146 0 1,1 274.9,104
      Z
      M 275,168
      A 82,82 0 1,0 275.1,168
      Z
    " />

    <!-- Diagonal 'Q' Tail Cutting Through Lower Right -->
    <polygon points="234,250 312,250 422,365 344,365" />
  </g>
</svg>